orion:
  name: ORION
  version: "0.1.0"

environment:
  default: development

runtime:
  debug: false
  data_directory: data
  log_directory: logs
  model_directory: models

interface:
  default: cli

voice:
  enabled: false

  # Keep the voice subsystem alive in the background.
  continuous: true

  auto_speak_responses: true

  microphone:
    duration_seconds: 5
    sample_rate: 16000
    vosk_model_path: "models/vosk-model-small-en-us-0.15"

  runtime:
    # Time between completed capture cycles.
    #
    # 0 means immediately begin the next capture.
    capture_interval_seconds: 0.0

    # Delay after an unexpected runtime failure.
    error_retry_delay_seconds: 2.0

    # Maximum time the application waits for the
    # background voice worker to stop.
    join_timeout_seconds: 3.0

  wake_word:
    enabled: true
    user_id: local-user
    phrase: "hey orion"

avatar:
  style: "cute-white-robot"
  accent_color: "mint-cyan"

brain:
  provider: local
  model: ""
  endpoint: "http://127.0.0.1:11434/api/generate"
  timeout_seconds: 120

memory:
  enabled: true

security:
  enabled: true
  require_confirmation: true