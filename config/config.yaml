orion:
  name: ORION
  version: "0.1.0"

environment:
  default: development

runtime:
  debug: false
  data_directory: data
  log_directory: logs
  model_directory: models

interface:
  default: cli

voice:
  wake_word:
    enabled: true
    user_id: local-user
    phrase: "hey orion"

avatar:
  style: "cute-white-robot"
  accent_color: "mint-cyan"

brain:
  provider: local
  model: ""

memory:
  enabled: true

security:
  enabled: true
  require_confirmation: true
